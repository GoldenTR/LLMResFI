[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llmresfi"
version = "0.1.0"
description = "Controllable IEEE-754 tensor bit-flip injection for LLM training resilience research"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "LLMResFI contributors" }]
keywords = ["fault-injection", "soft-error", "llm", "pytorch", "reliability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[tool.setuptools.packages.find]
include = ["llmresfi*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "cuda: tests requiring a working NVIDIA driver and CUDA device",
]
